<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0179BB">
  <title>Cari Karya - Galeri Karya STMM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/halaman/cari.css">
</head>
<body data-halaman="cari">
  <div class="app">
    <header class="bilah-atas">
      <h1 class="judul-layar">Cari Karya</h1>
    </header>

    <main class="konten">
      <!-- Bilah input pencarian -->
      <div class="cari-bar">
        <span class="cari-bar__ikon" id="ikon-cari" aria-hidden="true"></span>
        <input
          type="search"
          id="input-cari"
          class="cari-bar__input"
          placeholder="Judul karya atau nama kreator"
          aria-label="Cari karya atau nama kreator"
          autocomplete="off">
        <button type="button" id="tombol-hapus" class="cari-bar__hapus" aria-label="Hapus pencarian" style="display: none;">
          ✕
        </button>
      </div>

      <!-- Deret chip filter kategori -->
      <div class="deret-chip deret-chip--cari" id="daftar-chip-cari" role="toolbar" aria-label="Filter kategori"></div>

      <!-- Keterangan hasil -->
      <div class="cari-subjudul" id="subjudul-hasil">Karya terbaru</div>

      <!-- Daftar hasil pencarian -->
      <div class="cari-daftar" id="daftar-hasil"></div>

      <!-- Pesan kosong jika tidak ada hasil -->
      <div id="wadah-kosong" style="display: none;"></div>
    </main>

    <nav class="nav-bawah" id="nav-bawah" aria-label="Navigasi utama">
      <a class="nav-bawah__item" href="index.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Beranda
      </a>
      <a class="nav-bawah__item" href="kategori.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>Kategori
      </a>
      <a class="nav-bawah__item" href="cari.html" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"/></svg>Cari
      </a>
      <a class="nav-bawah__item" href="tentang.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01"/></svg>Tentang
      </a>
    </nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/halaman/cari.js"></script>
</body>
</html>
